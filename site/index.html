<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17202a">
  <meta name="description" content="Mindustry iOS 未签名 IPA 最新版本下载">
  <title>Mindustry iOS 下载</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #edf2f7; background: #17202a; }
    main { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 48px; }
    .eyebrow { color: #8dd3a8; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 12px 0 10px; font-size: clamp(34px, 8vw, 64px); line-height: 1; letter-spacing: 0; }
    .intro { max-width: 560px; margin: 0 0 34px; color: #b7c3cc; font-size: 17px; line-height: 1.6; }
    section { border-top: 1px solid #34434e; padding-top: 24px; }
    .label { margin: 0 0 6px; color: #91a2ae; font-size: 13px; }
    .version { margin: 0 0 24px; font-size: clamp(42px, 12vw, 82px); line-height: 1; font-variant-numeric: tabular-nums; }
    .status { min-height: 24px; margin: 0 0 22px; color: #b7c3cc; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border: 1px solid #8dd3a8; border-radius: 6px; color: #17202a; background: #8dd3a8; font-weight: 700; text-decoration: none; }
    a.secondary { border-color: #52636f; color: #edf2f7; background: transparent; }
    a[aria-disabled="true"] { pointer-events: none; opacity: .55; }
    dl { display: grid; grid-template-columns: 150px 1fr; gap: 12px 20px; margin: 30px 0 0; padding-top: 22px; border-top: 1px solid #34434e; }
    dt { color: #91a2ae; }
    dd { margin: 0; overflow-wrap: anywhere; }
    footer { margin-top: 48px; color: #91a2ae; font-size: 13px; line-height: 1.7; }
    footer a { display: inline; min-height: auto; padding: 0; border: 0; color: #8dd3a8; background: transparent; font-weight: 400; }
    @media (max-width: 520px) { main { padding-top: 42px; } dl { grid-template-columns: 1fr; gap: 4px; } dd { margin-bottom: 8px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Mindustry iOS IPA</div>
    <h1>最新版本下载</h1>
    <p class="intro">获取与上游 Mindustry Release 对齐的未签名 IPA。支持 TrollStore、AltStore 和其他侧载工具。</p>
    <section aria-live="polite">
      <p class="label">当前构建版本</p>
      <p class="version" id="version">加载中</p>
      <p class="status" id="status">正在查询 GitHub Release…</p>
      <div class="actions">
        <a id="download" href="#" aria-disabled="true" download>下载 IPA</a>
        <a id="metadata" class="secondary" href="#" aria-disabled="true" download>下载构建信息</a>
      </div>
      <dl>
        <dt>上游版本</dt><dd id="tag">—</dd>
        <dt>发布状态</dt><dd id="published">—</dd>
        <dt>文件</dt><dd id="filename">—</dd>
      </dl>
    </section>
    <footer>
      <a id="release" href="https://github.com/FiresonZ/mindustry-ios-builder/releases/latest">查看 GitHub Release</a>
      · <a href="https://github.com/FiresonZ/mindustry-ios-builder">查看源代码</a>
      <br>本页面实时读取 GitHub Releases API，不缓存版本号。
    </footer>
  </main>
  <script>
    const repository = 'FiresonZ/mindustry-ios-builder';
    const apiUrl = `https://api.github.com/repos/${repository}/releases/latest`;
    const setLink = (id, url) => {
      const link = document.getElementById(id);
      link.href = url || '#';
      link.setAttribute('aria-disabled', url ? 'false' : 'true');
    };
    const formatDate = value => value ? new Intl.DateTimeFormat('zh-CN', { dateStyle: 'medium' }).format(new Date(value)) : '—';
    fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' } })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(release => {
        const ipa = (release.assets || []).find(asset => asset.name.toLowerCase().endsWith('.ipa'));
        const metadata = (release.assets || []).find(asset => asset.name.toLowerCase().endsWith('.meta.txt'));
        document.getElementById('version').textContent = release.name || release.tag_name || '未知';
        document.getElementById('status').textContent = ipa ? '已找到最新构建，可以下载。' : 'Release 已发布，但暂未找到 IPA 文件。';
        document.getElementById('tag').textContent = release.tag_name || '—';
        document.getElementById('published').textContent = formatDate(release.published_at);
        document.getElementById('filename').textContent = ipa ? ipa.name : '—';
        setLink('download', ipa && ipa.browser_download_url);
        setLink('metadata', metadata && metadata.browser_download_url);
        setLink('release', release.html_url || `https://github.com/${repository}/releases/latest`);
      })
      .catch(error => {
        document.getElementById('version').textContent = '暂不可用';
        document.getElementById('status').textContent = `无法读取最新 Release（${error.message}）。请稍后重试或打开 GitHub Release。`;
      });
  </script>
</body>
</html>
